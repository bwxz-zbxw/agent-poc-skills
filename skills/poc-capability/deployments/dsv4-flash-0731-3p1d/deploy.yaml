# DeepSeek-V4-Flash-0731 · 3p1d 部署元数据（双机 16 卡，3 P + 1 D）
# 脚本来源：<DSH_HOME>/

model: "DeepSeek-V4-Flash-0731"
served_model_name: "dsv4_0905"
deployment: "3p1d"          # 3 × Prefill + 1 × Decode，双机 16 卡

topology:
  type: "PD 分离（双机 16 卡，每实例 dp4）"
  instances:
    - { name: "P1", ip: "<HOST_32>", device: "0,1,2,3", role: "kv_producer", port: 9000, kv_port: 30100, engine_id: 1, script: "./single-p.sh" }
    - { name: "P2", ip: "<HOST_32>", device: "4,5,6,7", role: "kv_producer", port: 9001, kv_port: 30200, engine_id: 2, script: "./single-p2.sh" }
    - { name: "P3", ip: "<HOST_31>", device: "0,1,2,3", role: "kv_producer", port: 9000, kv_port: 30600, engine_id: 1, script: "./single-p3.sh" }
    - { name: "D",  ip: "<HOST_31>", device: "4,5,6,7", role: "kv_consumer", port: 9001, kv_port: 36010, engine_id: 1, script: "./single-d.sh" }
  proxy:
    port: 14258
    prefill_hosts: ["<HOST_32>", "<HOST_32>", "<HOST_31>"]
    prefill_ports: "9000 9001 9000"
    decode_host: "<HOST_31>"
    decode_port: 9001
    script: "./double-proxy.sh"

# 服务化与镜像版本
image:
  vllm_version: "v0.27.1"
  container: "poc-dsv4-flash-0731-3p1d"     # 容器名 = poc-<部署目录名>，见 poc-benchmark 命名约定
  image_tag: ""           # TODO: 镜像 ID 运行时传参（docker_run.sh $1），未在脚本写死

weights: "<WEIGHTS_PATH>"

scripts:
  prefill: ["single-p.sh", "single-p2.sh", "single-p3.sh"]
  decode: ["single-d.sh"]
  proxy: "double-proxy.sh"
  docker: "docker_run.sh"

key_config:
  max_model_len: 1048576
  max_num_batched_tokens: 8192
  max_num_seqs_p: 8
  max_num_seqs_d: 128
  gpu_memory_utilization: 0.85
  data_parallel_size: 4
  tensor_parallel_size: 1
  enable_prefix_caching: true
  speculative_config: '{"method":"dspark","num_speculative_tokens":5,"enforce_eager":true}'
  kv_connector: "MooncakeHybridConnector"
  comm: "ASCEND_LOCAL_COMM_RES='{\"version\":\"1.3\"}' 动态 URMA"

# 测试相关约定（供性能测试子 skill 使用）
test_convention:
  proxy_host: "<HOST_31>"
  proxy_port: 14258        # aisbench 请求都打到 proxy，POD_INFO 用于查各 dp 域命中率
  served_model_name: "dsv4_0905"
  tokenizer: "<WEIGHTS_PATH>"
  multimodal: false        # 纯文本模型，多模态需另配服务
  pods_for_metrics: ["<HOST_31>:9000", "<HOST_31>:9001", "<HOST_32>:9000", "<HOST_32>:9001"]