# Qwen3.5-397B-A17B · standalone 部署元数据（由历史 POC 记录归纳，已脱敏）
# 占位符：<HOST_x>=机器 IP，<NIC>=通信网卡，<WEIGHTS_PATH>=权重目录（运行时替换）

model: "Qwen3.5-397B-A17B"
served_model_name: "qwen35"
deployment: "standalone"
hardware: "650E"
cards: "8"

topology:
  type: "单机单实例"
  instances:
    - { name: "S1", role: "hybrid", port: "8010", script: "start_all.sh" }

image:
  registry_image: "vllm-ascend:v0.23.0-a5-openeuler"
  vllm_version: "0.23.0"
  container: "poc-qwen35-397b-a17b-standalone"

weights: "<WEIGHTS_PATH>"

scripts:
  all: ["start_all.sh"]

key_config:
  max_num_batched_tokens: "8192"
  gpu_memory_utilization: "0.9"
  data_parallel_size_p: "4"
  tensor_parallel_size_p: "2"
  max_num_seqs_p: "64"
  data_parallel_size_d: "4"
  tensor_parallel_size_d: "2"
  max_num_seqs_d: "64"
  quantization: "ascend"
  speculative_method: "qwen3_5_mtp"
  speculative_tokens: "5"
  enable_prefix_caching_p: true
  enable_expert_parallel: true
  async_scheduling: true
  enforce_eager: false

# 测试相关约定（供性能测试子 skill 使用）
test_convention:
  served_model_name: "qwen35"
  tokenizer: "<WEIGHTS_PATH>"
  multimodal: false        # 历史记录均为纯文本压测
  history_rows: 10          # 该组合在历史表格中出现次数（可信度参考）
