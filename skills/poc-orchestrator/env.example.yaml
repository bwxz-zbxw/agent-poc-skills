# ============================================================
# 运行环境信息 —— 本地私有配置【模板】
# ------------------------------------------------------------
# 用法：
#   1. 安装脚本会把本文件自动复制为 env.local.yaml（仅当它不存在时）；
#   2. 在 env.local.yaml 里填真实值 —— 它被 .gitignore 排除，且安装脚本永不覆盖；
#   3. 本文件（env.example.yaml）随仓库提交，只放占位符，不要填真实值。
#
# 谁在读它：poc-capability（阶段① 环境校验）、poc-benchmark（起服务/压测）、
#           poc-aisbench / poc-vllmbench（HOST_IP / POD_INFO 等）
#
# 校验策略：任一必填项仍为 <...> 占位符时，poc-capability 会停下来反问用户补齐，
#           补齐后才放行起服务 / 压测。
# ============================================================

env:
  # ---- 必填 ----
  host_31: "<HOST_31>"        # 机器 31 的 IP（PD 分离时的 P3/D 所在机）
  host_32: "<HOST_32>"        # 机器 32 的 IP（P1/P2 所在机）；单机部署可留空
  ssh_user: "<SSH_USER>"      # SSH 登录账号（跨机部署脚本用）
  weights: "<WEIGHTS_PATH>"   # 模型权重目录（tokenizer 所在）
  workdir: "<WORKDIR>"        # 部署 / 测试工作目录

  # ---- 多机部署必填，单机可留空 ----
  nic: "<NIC>"                # HCCL / GLOO 通信网卡名（如 eth2、enp34s0f1、data0.3001）

  # ---- 可选 ----
  registry: "<REGISTRY>"      # 内部镜像仓库地址（deploy.yaml 里 <INTERNAL_REGISTRY> 的实体）
  proxy_host: "<PROXY_HOST>"  # 前置代理 / LB 地址（PD 多实例对外统一入口）
  proxy_port: 14258           # 前置代理端口

# 说明：
#   - 部署脚本里的 <HOST_A>/<HOST_B>/<NIC>/<WEIGHTS_PATH>/<INTERNAL_REGISTRY>
#     依次对应上面的 host_31 / host_32 / nic / weights / registry。
#   - 容器名不需要填：自动按 poc-<部署目录名> 生成。
#   - 输出目录不需要填：自动生成。
